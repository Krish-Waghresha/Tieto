name: decision-sign
# Validates a `/sign` PR *review* against the evidence record for the exact PR head and records the human decision.
#
# KNOWN LIMITATION (documented, not hidden): GitHub runs `pull_request_review` workflows from the PR merge ref, so a
# malicious same-repo PR could edit this file. `issue_comment`/`workflow_run` alternatives only run from the default
# branch. Production design: a GitHub App (or default-branch workflow_run) sets the status, plus a ruleset/CODEOWNERS
# protecting .github/**, reviewbot/** and review-policy.json — and triage already forces DEEP on any change to them.
on:
  pull_request_review:
    types: [submitted]

permissions:
  contents: read

jobs:
  sign:
    if: startsWith(github.event.review.body, '/sign')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
      statuses: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      AUTHOR: ${{ github.event.pull_request.user.login }}
      SIGNER: ${{ github.event.review.user.login }}
      ASSOC: ${{ github.event.review.author_association }}
      BODY: ${{ github.event.review.body }}
      REVIEW_STATE: ${{ github.event.review.state }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - name: Fetch the evidence record built for this exact head (newest artifact by name)
        run: |
          ART=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=decision-ledger-$HEAD_SHA&per_page=1" --jq '.artifacts[0].id // empty')
          test -n "$ART" || { echo "no evidence record for head $HEAD_SHA — the review bot has not finished"; exit 1; }
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ART/zip" > ledger.zip
          mkdir -p ledger && unzip -q -o ledger.zip -d ledger
      - name: Validate and record
        run: |
          printf '%s' "$BODY" > body.txt
          AUTHORS=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/commits" --paginate --jq '.[].author.login // empty' | sort -u | paste -sd, -)
          mkdir -p out
          python3 -m reviewbot sign --ledger ledger/ledger.json --body-file body.txt --signer "$SIGNER" \
            --head "$HEAD_SHA" --author "$AUTHOR" --review-state "$REVIEW_STATE" --association "$ASSOC" \
            --commit-authors "$AUTHORS" --pr "$PR" --out out/sign-result.json --reply out/reply.json --status out/status.json
          gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --input out/reply.json > /dev/null
          gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" --input out/status.json > /dev/null
