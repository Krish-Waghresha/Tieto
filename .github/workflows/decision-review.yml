name: decision-review
# Decision-First Review demo.
# pull_request_target: the workflow file, bot, policy, proof script and pinned upstream SHAs all come from the BASE branch.
# The PR's files are only read as data (git show / diff); no PR code is executed with a write token.
on:
  pull_request_target:
    branches: [demo/base]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: decision-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  proofs:
    name: Executable proofs (upstream MessagePack, read-only token)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      PR: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Check out the BASE revision (scripts and pinned SHAs come from here)
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - name: Fetch PR head as data only
        run: git fetch --no-tags --depth=1 origin "+refs/pull/$PR/head:refs/remotes/pr/head"
      - name: Clone upstream challenge repo (full history for versioning)
        run: |
          git clone --quiet https://github.com/te-industry-tech-office/junction26-messagepack-csharp.git upstream
          git -C upstream fetch --quiet origin ju26-issue-2283
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: upstream/global.json
      - name: Run proofs P0-P4 (upstream code runs with a read-only token and no secrets)
        run: ci/run_proofs.sh "$PWD/upstream" "$PWD/evidence" "$HEAD_SHA"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: evidence-${{ github.event.pull_request.head.sha }}
          path: evidence/
          retention-days: 30

  review:
    name: Decision-First Review
    needs: proofs
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
      statuses: write
    env:
      GH_TOKEN: ${{ github.token }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      PR: ${{ github.event.pull_request.number }}
      AUTHOR: ${{ github.event.pull_request.user.login }}
    steps:
      - name: Check out the BASE revision (bot + policy)
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch PR head as data only
        run: git fetch --no-tags origin "+refs/pull/$PR/head:refs/remotes/pr/head"
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: evidence-${{ github.event.pull_request.head.sha }}
          path: evidence
      - name: Unit-test the verdict engine
        run: python3 -m unittest tests/test_reviewbot.py
      - name: Build evidence record, comment and report
        run: |
          python3 -m reviewbot review --base "$BASE_SHA" --head "$HEAD_SHA" \
            --evidence evidence --provenance evidence/provenance.json --out out \
            --repo "$GITHUB_REPOSITORY" --pr "$PR" --author "$AUTHOR"
          cp out/report.html "out/decision-review-pr$PR-${HEAD_SHA:0:7}.html"
      - name: Upload HTML report (single file, opens in the browser)
        id: report
        uses: actions/upload-artifact@v7
        with:
          path: out/decision-review-pr${{ github.event.pull_request.number }}-*.html
          archive: false
          retention-days: 30
      - name: Upload evidence record
        uses: actions/upload-artifact@v7
        with:
          name: decision-ledger-${{ github.event.pull_request.head.sha }}
          path: out/ledger.json
          retention-days: 30
      - name: Post sticky comment and pending human-decision status
        env:
          REPORT_URL: ${{ steps.report.outputs.artifact-url }}
        run: |
          python3 -m reviewbot comment --ledger out/ledger.json --report-url "$REPORT_URL" --out out/payload.json
          jq -r .body out/payload.json >> "$GITHUB_STEP_SUMMARY"
          ID=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
               --jq '.[] | select(.user.login=="github-actions[bot]") | select(.body | startswith("<!-- dfr:sticky -->")) | .id' | head -n1)
          if [ -n "$ID" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$ID" --input out/payload.json > /dev/null
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --input out/payload.json > /dev/null
          fi
          TIER=$(jq -r .triage.tier out/ledger.json)
          gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" -f state=pending -f context=decision-record \
            -f description="$TIER review: awaiting a named human /sign (AI never approves)" -f target_url="$REPORT_URL" > /dev/null
